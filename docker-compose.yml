services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasteiq
      POSTGRES_USER: tasteiq
      POSTGRES_PASSWORD: tasteiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasteiq -d tasteiq"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://tasteiq:tasteiq@postgres:5432/tasteiq
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
